<!DOCTYPE html>
<html lang="en">
<head>
    {% include head.html %}
</head>
<body>
    <header class="topbar">
        <a href="{{ '/' | relative_url }}" class="topbar-logo"><img src="{{ '/assets/images/logo.png' | relative_url }}" alt="Jam"></a>
        <button type="button" class="topbar-menu" data-nav-toggle aria-controls="sidebar" aria-expanded="false" aria-label="Open menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
    </header>

    <div class="shell">
        {% include sidebar.html %}

        <main class="content">
            {{ content }}

            <footer class="content-foot">
                &copy; {{ 'now' | date: "%Y" }} Raphael Amorim
            </footer>
        </main>
    </div>

    <!-- Prism syntax highlighting for `language-jam` code blocks.
         The jam language definition lives in /assets/js/jam-prism.js;
         keywords/operators mirror tree-sitter-jam's highlights.scm. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script src="{{ '/assets/js/jam-prism.js' | relative_url }}"></script>
    <script>
        Prism.highlightAll();

        // Mobile: the sidebar becomes a drawer under the top bar.
        (function () {
            const btn = document.querySelector('[data-nav-toggle]');
            const sidebar = document.getElementById('sidebar');
            btn.addEventListener('click', function () {
                const open = document.body.classList.toggle('nav-open');
                btn.setAttribute('aria-expanded', String(open));
                btn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
            });
            sidebar.addEventListener('click', function (e) {
                if (e.target.closest('a')) document.body.classList.remove('nav-open');
            });
        })();

        // Search filters the sidebar; ⌘K / Ctrl+K focuses it, Enter
        // follows the first match, Escape clears.
        (function () {
            const input = document.getElementById('search');
            const sidebar = document.getElementById('sidebar');
            const groups = document.querySelectorAll('.nav-group');
            const topbar = document.querySelector('.topbar');
            function matches(el, q) { return el.textContent.toLowerCase().includes(q); }
            // While searching, every page's sections are searchable, not
            // just the current page's.
            function filter() {
                const q = input.value.trim().toLowerCase();
                sidebar.classList.toggle('searching', q !== '');
                groups.forEach(function (group) {
                    let any = false;
                    group.querySelectorAll('.nav-page').forEach(function (page) {
                        let hit = !q || matches(page.querySelector('a'), q);
                        page.querySelectorAll('.nav-tree li').forEach(function (li) {
                            const sub = !q || matches(li, q);
                            li.hidden = !sub;
                            hit = hit || sub;
                        });
                        page.hidden = !hit;
                        any = any || hit;
                    });
                    group.hidden = !any;
                });
            }
            input.addEventListener('input', filter);
            input.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    const q = input.value.trim().toLowerCase();
                    const first = Array.from(document.querySelectorAll('.sidebar-nav li a')).find(function (a) {
                        return !a.closest('li[hidden]') && (!q || matches(a, q));
                    });
                    if (first) first.click();
                } else if (e.key === 'Escape') {
                    input.value = '';
                    filter();
                    input.blur();
                }
            });
            document.addEventListener('keydown', function (e) {
                if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
                    e.preventDefault();
                    if (getComputedStyle(topbar).display !== 'none') document.body.classList.add('nav-open');
                    input.focus();
                    input.select();
                }
            });
        })();

        // Highlight the section currently in view, and fill the rail
        // beside the section list down to it.
        (function () {
            const links = {};
            document.querySelectorAll('.sidebar-nav .nav-tree a').forEach(function (a) {
                const url = new URL(a.href);
                if (url.pathname === location.pathname && url.hash) links[url.hash.slice(1)] = a;
            });
            const headings = Array.from(document.querySelectorAll('.content h2[id]')).filter(function (h) { return links[h.id]; });
            if (!headings.length) return;
            const tree = links[headings[0].id].closest('.nav-tree');
            let current;
            function paint() {
                const li = current ? links[current].closest('li') : null;
                let passed = li !== null;
                Array.from(tree.children).forEach(function (item) {
                    if (item === li) passed = false;
                    item.classList.toggle('read', passed);
                });
                tree.style.setProperty('--level', (li ? li.offsetTop + li.offsetHeight : 0) + 'px');
            }
            function update() {
                let id = null;
                for (const h of headings) {
                    if (h.getBoundingClientRect().top < 140) id = h.id; else break;
                }
                // At the very bottom the last section may be too short to
                // reach the top of the window; count it as reached.
                const doc = document.documentElement;
                if (doc.scrollHeight > window.innerHeight && window.innerHeight + window.scrollY >= doc.scrollHeight - 2) {
                    id = headings[headings.length - 1].id;
                }
                if (id === current) return;
                if (current) links[current].classList.remove('active');
                if (id) links[id].classList.add('active');
                current = id;
                paint();
            }
            document.addEventListener('scroll', update, { passive: true });
            window.addEventListener('resize', paint);
            document.getElementById('search').addEventListener('input', paint);
            update();
        })();
    </script>
</body>
</html>
